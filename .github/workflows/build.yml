name: build

on:
  push:
    branches:
      - main
      - feature/*
      - fix/*
  pull_request:
    branches:
      - main

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate_token
        if: github.ref == 'refs/heads/main'
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID_ADMIN_GITHUB }}
          private_key: ${{ secrets.APP_PRIVATE_KEY_ADMIN_GITHUB }}
      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/main'
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.ref != 'refs/heads/main'

      - name: Verify Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up NodeJS
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Set up Semantic Release
        if: github.ref == 'refs/heads/main'
        run: npm -g install @semantic-release/git semantic-release@23.0.0

      - name: Semantic Release
        if: github.ref == 'refs/heads/main'
        run: npx semantic-release@23.0.0
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Download and install IBM MQ redistributable client manually
        run: |
          # Create installation directory
          mkdir -p /opt/mqm
          # Download and extract the client (example version 9.3.0.0)
          curl -sL 'https://public.dhe.ibm.com/ibmdl/export/pub/software/websphere/messaging/mqdev/redist/9.3.0.0-IBM-MQC-Redist-LinuxX64.tar.gz' | tar xz -C /opt/mqm
          # Set necessary environment variable for libraries
          echo "LD_LIBRARY_PATH=/opt/mqm/lib64" >> $GITHUB_ENV
          # Add MQ bin to PATH to use commands like dspmqver
          echo "/opt/mqm/bin" >> $GITHUB_PATH

      - name: Verify MQ installation using dspmqver
        run: dspmqver

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Install the version declared in go.mod so the runner never has to
          # auto-download a different toolchain (which mixes Go versions and
          # fails with "compile: version ... does not match go tool version").
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Go Vet
        run: |
          go vet ./...

      - name: Test and generate coverage
        # Examples are demo programs covered by integration runs, not unit
        # tests; keep them out of the coverage profile. -coverpkg is needed
        # because all tests live in tests/unit (an external test package), so
        # Go would otherwise not attribute their execution to the library
        # packages.
        run: |
          PKGS=$(go list ./... | grep -v '/examples')
          go test -race -covermode=atomic -coverpkg=$(echo $PKGS | tr ' ' ',') -coverprofile=coverage.out $PKGS

      # Switched to autoscan
